schema: spec-driven

context: |
  todo.hx: Helix plugin (Steel/Scheme) — navigation between structured
  @info tags (TODO, NOTE, PERF, ...) inside comments, through the
  injected tree-sitter "comment" grammar and Steel's query-document
  pipeline.
  Helix reference branch: steel-event-system (commit 09d67dfe7,
  2026-09-17) vendored in docs/vendor/; the user's real binary is
  hx 25.07.1 — when in doubt about a signature, test against the
  binary. API index: docs/api-index.md (generated by
  scripts/gen-api-index.sh). Known constraints: no format /
  number->string in the Steel prelude; every identifier must be
  defined before use; the query-document loader must return a query
  (even an empty one) for every traversed language; no test suite —
  manual verification in Helix.

rules:
  specs:
    - Reference the existing helix/*.scm modules (docs/api-index.md,
      sources in docs/vendor/) before proposing new ones.
    - Scenarios describe observable behavior, not the underlying Steel
      code.
  design:
    - Justify every choice with a rejected alternative, and record it
      in the change's design.md.
  tasks:
    - Every test task must state how it will be verified (Helix
      scenario, script, or source reading).
